---
# Single-node Elasticsearch for local MicroK8s development.
# The full Camunda platform still runs; only Elasticsearch HA is intentionally
# reduced because a normal workstation MicroK8s installation has one node.
apiVersion: elasticsearch.k8s.elastic.co/v1
kind: Elasticsearch
metadata:
    name: elasticsearch
spec:
    # renovate: datasource=docker depName=docker.elastic.co/elasticsearch/elasticsearch
    version: 8.19.19
    http:
        tls:
            selfSignedCertificate:
                disabled: true
    nodeSets:
        - name: masters
          count: 1
          config:
              node.store.allow_mmap: 'false'
              logger.org.elasticsearch.deprecation: "OFF"
              # ECK normally publishes HTTP via
              # ${POD_NAME}.${HEADLESS_SERVICE_NAME}.${NAMESPACE}.svc. On a
              # single-node local cluster that makes Elasticsearch bootstrap
              # depend on CoreDNS/headless-service propagation. ECK already
              # injects POD_IP, so publish HTTP directly on the pod address.
              http.publish_host: "${POD_IP}"
          podTemplate:
              spec:
                  containers:
                      - name: elasticsearch
                        securityContext:
                            readOnlyRootFilesystem: true
                        env:
                            - name: ELASTICSEARCH_ENABLE_REST_TLS
                              value: 'false'
                            - name: READINESS_PROBE_TIMEOUT
                              value: '300'
                        resources:
                            requests:
                                cpu: 500m
                                memory: 1Gi
                            limits:
                                cpu: 1
                                memory: 1Gi
          volumeClaimTemplates:
              - metadata:
                    name: elasticsearch-data
                spec:
                    storageClassName: microk8s-hostpath
                    accessModes: [ReadWriteOnce]
                    resources:
                        requests:
                            storage: 16Gi
